<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriBot">
<meta name="theme-color" content="#080810">
<title>NutriBot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080810; --bg2:#0e0e1a; --card:#13131f; --card2:#1a1a2a;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --accent:#e8ff6b; --accent2:#6bffd4; --accent3:#ff6b9d; --orange:#ffaa6b;
  --text:#f0f0f8; --text2:#9090b0; --text3:#50506a;
  --safe-top:env(safe-area-inset-top,44px); --safe-bottom:env(safe-area-inset-bottom,34px);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
.app { height:100vh; height:-webkit-fill-available; display:flex; flex-direction:column; overflow:hidden; }
.status-bar { height:var(--safe-top); background:var(--bg); flex-shrink:0; }
.header { padding:12px 20px 14px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.header h1 { font-family:'DM Serif Display',serif; font-size:26px; letter-spacing:-0.5px; line-height:1; }
.header h1 em { font-style:italic; color:var(--accent); }
.header-date { font-family:'DM Mono',monospace; font-size:11px; color:var(--text3); margin-top:3px; }
.sync-btn { width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; transition:all .15s; }
.sync-btn:active { transform:scale(.92); }
.sync-btn.spinning { animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.scroll-area { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:0 14px; padding-bottom:calc(85px + var(--safe-bottom)); }
.scroll-area::-webkit-scrollbar { display:none; }

/* RING CARD */
.ring-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:10px; display:flex; align-items:center; gap:20px; position:relative; overflow:hidden; animation:fadeUp .4s ease both; }
.ring-card::before { content:''; position:absolute; top:-60px; right:-60px; width:180px; height:180px; background:radial-gradient(circle,rgba(232,255,107,.06) 0%,transparent 70%); pointer-events:none; }
.ring-wrap { position:relative; width:100px; height:100px; flex-shrink:0; }
.ring-wrap svg { transform:rotate(-90deg); width:100px; height:100px; }
.ring-bg { fill:none; stroke:var(--card2); stroke-width:10; }
.ring-fill { fill:none; stroke-width:10; stroke-linecap:round; stroke:url(#rg); stroke-dasharray:283; stroke-dashoffset:283; transition:stroke-dashoffset 1.2s cubic-bezier(.34,1.56,.64,1); }
.ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-pct { font-family:'DM Serif Display',serif; font-size:24px; line-height:1; color:var(--accent); }
.ring-unit { font-family:'DM Mono',monospace; font-size:9px; color:var(--text3); letter-spacing:1px; margin-top:2px; }
.ring-info { flex:1; }
.ring-kcal { font-family:'DM Serif Display',serif; font-size:32px; letter-spacing:-1px; line-height:1; }
.ring-kcal span { font-size:14px; color:var(--text2); font-family:'DM Sans',sans-serif; font-weight:300; }
.ring-goal { font-family:'DM Mono',monospace; font-size:11px; color:var(--text3); margin-top:5px; }
.ring-badge { margin-top:10px; display:inline-flex; align-items:center; gap:5px; border-radius:20px; padding:5px 12px; font-size:12px; font-weight:500; }
.badge-ok   { background:rgba(232,255,107,.1); border:1px solid rgba(232,255,107,.2); color:var(--accent); }
.badge-over { background:rgba(255,107,157,.1); border:1px solid rgba(255,107,157,.2); color:var(--accent3); }

/* MACRO */
.macro-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; animation:fadeUp .4s ease .1s both; }
.macro-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; position:relative; overflow:hidden; }
.macro-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; border-radius:0 0 14px 14px; }
.mc-protein::after { background:var(--accent2); }
.mc-carbs::after   { background:var(--orange); }
.mc-fat::after     { background:var(--accent3); }
.macro-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text3); margin-bottom:5px; }
.macro-val { font-family:'DM Serif Display',serif; font-size:20px; letter-spacing:-.5px; line-height:1; }
.mc-protein .macro-val { color:var(--accent2); }
.mc-carbs   .macro-val { color:var(--orange); }
.mc-fat     .macro-val { color:var(--accent3); }
.macro-unit { font-size:11px; color:var(--text3); }
.macro-bar { margin-top:7px; height:3px; background:var(--card2); border-radius:2px; overflow:hidden; }
.macro-fill { height:100%; border-radius:2px; transition:width .8s cubic-bezier(.34,1.56,.64,1); width:0%; }
.mc-protein .macro-fill { background:var(--accent2); }
.mc-carbs   .macro-fill { background:var(--orange); }
.mc-fat     .macro-fill { background:var(--accent3); }

/* SECTION */
.section-title { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text3); padding:4px 2px 10px; display:flex; align-items:center; justify-content:space-between; }

/* MEALS */
.meals-list { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; animation:fadeUp .4s ease .2s both; }
.meal-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 15px; display:flex; align-items:center; gap:12px; }
.meal-emoji { width:42px; height:42px; border-radius:10px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; border:1px solid var(--border); }
.meal-info { flex:1; min-width:0; }
.meal-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px; }
.meal-meta { font-family:'DM Mono',monospace; font-size:10px; color:var(--text3); }
.meal-src { font-size:9px; padding:2px 6px; border-radius:4px; font-family:'DM Mono',monospace; margin-top:3px; display:inline-block; }
.src-photo  { background:rgba(232,255,107,.1); color:var(--accent); }
.src-label  { background:rgba(107,255,212,.1); color:var(--accent2); }
.src-manual { background:rgba(255,107,157,.1); color:var(--accent3); }
.meal-kcal { font-family:'DM Serif Display',serif; font-size:17px; color:var(--accent); letter-spacing:-.5px; text-align:right; flex-shrink:0; }
.meal-time { font-family:'DM Mono',monospace; font-size:10px; color:var(--text3); text-align:right; margin-top:2px; }

/* HISTORY */
.week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:10px; animation:fadeUp .4s ease .1s both; }
.week-day { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 3px; text-align:center; cursor:pointer; transition:all .15s; }
.week-day.today { border-color:var(--accent); background:rgba(232,255,107,.06); }
.wd-name { font-family:'DM Mono',monospace; font-size:8px; color:var(--text3); margin-bottom:3px; letter-spacing:.5px; }
.wd-num { font-size:13px; font-weight:600; margin-bottom:5px; }
.wd-bar-wrap { height:32px; background:var(--card2); border-radius:3px; display:flex; align-items:flex-end; overflow:hidden; }
.wd-bar { width:100%; border-radius:3px; transition:height .5s cubic-bezier(.34,1.56,.64,1); }
.wd-bar.good { background:var(--accent2); }
.wd-bar.over { background:var(--accent3); }
.wd-bar.low  { background:var(--text3); }
.wd-kcal { font-family:'DM Mono',monospace; font-size:7px; color:var(--text3); margin-top:3px; }

/* TAB BAR */
.tab-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(8,8,16,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; padding-bottom:var(--safe-bottom); z-index:100; }
.tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0 8px; cursor:pointer; gap:3px; transition:all .15s; }
.tab-item:active { opacity:.7; }
.tab-icon { font-size:21px; transition:transform .15s; }
.tab-item.active .tab-icon { transform:scale(1.1); }
.tab-label { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:.5px; color:var(--text3); }
.tab-item.active .tab-label { color:var(--accent); }

/* PAGES */
.page { display:none; }
.page.active { display:block; }

/* EMPTY */
.empty { text-align:center; padding:30px 16px; color:var(--text3); }
.empty .big { font-size:44px; margin-bottom:10px; }
.empty p { font-size:13px; line-height:1.6; }

/* ERROR */
.error-card { background:rgba(255,107,157,.08); border:1px solid rgba(255,107,157,.2); border-radius:14px; padding:16px; margin-bottom:10px; font-size:13px; color:var(--accent3); }

@keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* STATS */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; animation:fadeUp .4s ease .1s both; }
.stat-box { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
.stat-box .sb-label { font-family:'DM Mono',monospace; font-size:9px; color:var(--text3); letter-spacing:1px; text-transform:uppercase; margin-bottom:5px; }
.stat-box .sb-val { font-family:'DM Serif Display',serif; font-size:22px; letter-spacing:-.5px; }
.sb-val.c-green  { color:var(--accent2); }
.sb-val.c-yellow { color:var(--accent); }
.sb-val.c-red    { color:var(--accent3); }
</style>
</head>
<body>
<div class="app">
  <div class="status-bar"></div>
  <div class="header">
    <div>
      <h1>Nutri<em>Bot</em></h1>
      <div class="header-date" id="headerDate"></div>
    </div>
    <div class="sync-btn" id="syncBtn" onclick="loadAll()" title="Odśwież">🔄</div>
  </div>

  <div class="scroll-area">
    <!-- DZIŚ -->
    <div class="page active" id="page-today">
      <div id="todayContent"><div class="empty"><div class="big">⏳</div><p>Ładowanie...</p></div></div>
    </div>
    <!-- HISTORIA -->
    <div class="page" id="page-history">
      <div id="historyContent"><div class="empty"><div class="big">⏳</div><p>Ładowanie...</p></div></div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab-item active" id="tab-today" onclick="switchPage('today')">
      <div class="tab-icon">🥗</div><div class="tab-label">DZIŚ</div>
    </div>
    <div class="tab-item" id="tab-history" onclick="switchPage('history')">
      <div class="tab-icon">📈</div><div class="tab-label">HISTORIA</div>
    </div>
  </div>
</div>

<script>
const DAY_NAMES = ['Nd','Pn','Wt','Śr','Cz','Pt','Sb'];
const MONTHS = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];

function formatHeaderDate() {
  const d = new Date();
  return `${DAY_NAMES[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

document.getElementById('headerDate').textContent = formatHeaderDate();

// ── API calls ───────────────────────────────────
async function fetchToday() {
  const r = await fetch('/api/today');
  if (!r.ok) throw new Error('API error ' + r.status);
  return r.json();
}

async function fetchHistory() {
  const r = await fetch('/api/history');
  if (!r.ok) throw new Error('API error ' + r.status);
  return r.json();
}

// ── RENDER TODAY ─────────────────────────────────
function renderToday(data) {
  const { total_kcal, goal, remaining, total_protein, total_carbs, total_fat, meals } = data;
  const pct = Math.min(total_kcal / goal, 1.1);
  const pctDisplay = Math.round(pct * 100);
  const circ = 283;
  const offset = circ * (1 - Math.min(pct, 1));
  const isOver = remaining < 0;

  const mealHTML = meals.length === 0
    ? `<div class="empty"><div class="big">🍽️</div><p>Brak posiłków dziś.<br>Wyślij zdjęcie botowi na Telegramie!</p></div>`
    : meals.map(m => {
        const src = m.source === 'label' ? 'src-label' : m.source === 'manual' ? 'src-manual' : 'src-photo';
        const srcLabel = m.source === 'label' ? '🏷 etykieta' : m.source === 'manual' ? '✏️ ręcznie' : '📷 zdjęcie';
        const emoji = m.emoji || '🍴';
        return `<div class="meal-card">
          <div class="meal-emoji">${emoji}</div>
          <div class="meal-info">
            <div class="meal-name">${esc(m.name)}</div>
            <div class="meal-meta">B:${round(m.protein||0)}g · W:${round(m.carbs||0)}g · T:${round(m.fat||0)}g</div>
            <span class="meal-src ${src}">${srcLabel}</span>
          </div>
          <div>
            <div class="meal-kcal">${m.kcal}</div>
            <div class="meal-time">${m.time||''}</div>
          </div>
        </div>`;
      }).join('');

  document.getElementById('todayContent').innerHTML = `
    <div class="ring-card">
      <div class="ring-wrap">
        <svg viewBox="0 0 100 100">
          <defs><linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e8ff6b"/>
            <stop offset="100%" stop-color="#6bffd4"/>
          </linearGradient></defs>
          <circle class="ring-bg" cx="50" cy="50" r="45"/>
          <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="45"/>
        </svg>
        <div class="ring-center">
          <div class="ring-pct">${pctDisplay}%</div>
          <div class="ring-unit">KCAL</div>
        </div>
      </div>
      <div class="ring-info">
        <div class="ring-kcal">${total_kcal.toLocaleString('pl')} <span>kcal</span></div>
        <div class="ring-goal">cel: ${goal.toLocaleString('pl')} kcal/dzień</div>
        <div class="ring-badge ${isOver ? 'badge-over' : 'badge-ok'}">
          ${isOver ? '⚠ ' + Math.abs(remaining) + ' kcal powyżej' : '✦ ' + remaining + ' kcal pozostało'}
        </div>
      </div>
    </div>
    <div class="macro-row">
      <div class="macro-card mc-protein">
        <div class="macro-label">Białko</div>
        <div class="macro-val">${round(total_protein)}<span class="macro-unit">g</span></div>
        <div class="macro-bar"><div class="macro-fill" style="width:${Math.min(total_protein/140*100,100)}%"></div></div>
      </div>
      <div class="macro-card mc-carbs">
        <div class="macro-label">Węgle</div>
        <div class="macro-val">${round(total_carbs)}<span class="macro-unit">g</span></div>
        <div class="macro-bar"><div class="macro-fill" style="width:${Math.min(total_carbs/250*100,100)}%"></div></div>
      </div>
      <div class="macro-card mc-fat">
        <div class="macro-label">Tłuszcze</div>
        <div class="macro-val">${round(total_fat)}<span class="macro-unit">g</span></div>
        <div class="macro-bar"><div class="macro-fill" style="width:${Math.min(total_fat/70*100,100)}%"></div></div>
      </div>
    </div>
    <div class="section-title">Posiłki dziś <span>${meals.length} wpisów</span></div>
    <div class="meals-list">${mealHTML}</div>
  `;

  // Animuj ring po renderze
  setTimeout(() => {
    const fill = document.getElementById('ringFill');
    if (fill) fill.style.strokeDashoffset = offset;
  }, 100);
}

// ── RENDER HISTORY ────────────────────────────────
function renderHistory(days) {
  const maxKcal = Math.max(...days.map(d => d.kcal), 1);
  const goal = 2000; // domyślne — można pobrac z /api/today
  const totalKcal = days.reduce((s,d) => s + d.kcal, 0);
  const daysWithData = days.filter(d => d.kcal > 0).length;
  const avg = daysWithData ? Math.round(totalKcal / daysWithData) : 0;
  const onTarget = days.filter(d => d.kcal > 0 && d.kcal >= goal * 0.9 && d.kcal <= goal * 1.1).length;
  const over = days.filter(d => d.kcal > goal * 1.1).length;

  const todayStr = new Date().toISOString().split('T')[0];

  const gridHTML = days.map(d => {
    const pct = d.kcal ? Math.min(d.kcal / maxKcal, 1) : 0;
    const barH = Math.round(pct * 100);
    const cls = d.kcal > goal * 1.1 ? 'over' : d.kcal > 0 ? 'good' : 'low';
    const isToday = d.date === todayStr;
    return `<div class="week-day ${isToday ? 'today' : ''}">
      <div class="wd-name">${d.day}</div>
      <div class="wd-num">${d.label.split('.')[0]}</div>
      <div class="wd-bar-wrap"><div class="wd-bar ${cls}" style="height:${barH}%"></div></div>
      <div class="wd-kcal">${d.kcal || '—'}</div>
    </div>`;
  }).join('');

  document.getElementById('historyContent').innerHTML = `
    <div class="section-title" style="padding-top:4px">Ostatnie 7 dni</div>
    <div class="week-grid">${gridHTML}</div>
    <div class="section-title">Podsumowanie tygodnia</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="sb-label">Śr. kalorie</div><div class="sb-val c-yellow">${avg || '—'}</div></div>
      <div class="stat-box"><div class="sb-label">Dni w celu</div><div class="sb-val c-green">${onTarget}/7</div></div>
      <div class="stat-box"><div class="sb-label">Przekroczenia</div><div class="sb-val c-red">${over}</div></div>
      <div class="stat-box"><div class="sb-label">Dni z danymi</div><div class="sb-val c-yellow">${daysWithData}/7</div></div>
    </div>
  `;
}

// ── LOAD ALL ──────────────────────────────────────
async function loadAll() {
  const btn = document.getElementById('syncBtn');
  btn.classList.add('spinning');
  try {
    const [today, history] = await Promise.all([fetchToday(), fetchHistory()]);
    renderToday(today);
    renderHistory(history);
  } catch(e) {
    document.getElementById('todayContent').innerHTML =
      `<div class="error-card">❌ Błąd połączenia z API: ${e.message}<br><br>Upewnij się że bot działa na Railway.</div>`;
  } finally {
    btn.classList.remove('spinning');
  }
}

function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.getElementById('tab-' + page).classList.add('active');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function round(v) { return Math.round(parseFloat(v) || 0); }

// Auto-odświeżanie co 60 sekund
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
